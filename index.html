<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đăng kiểm tàu cá – Lập biên bản</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f5;--card:#fff;--ink:#14262e;--mut:#5a6f78;--line:#cbd8de;--sea:#0b5f80;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1f;--card:#17262d;--ink:#e6eef1;--mut:#93a8b1;--line:#2b414a;--sea:#5bb6d9;--on:#07222d}}
:root[data-theme="dark"]{--bg:#0f1a1f;--card:#17262d;--ink:#e6eef1;--mut:#93a8b1;--line:#2b414a;--sea:#5bb6d9;--on:#07222d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
header{padding:18px 16px 6px;max-width:820px;margin:auto}
h1{font-size:20px;margin:0}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
main{max-width:820px;margin:auto;padding:8px 12px 90px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
h2{font-size:15px;margin:0 0 8px;color:var(--sea)}h3{font-size:14px;margin:6px 0 0}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 10px}.w{grid-column:1/-1}
label{display:block;font-size:12.5px;color:var(--mut)}
input,select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 8px;margin-top:2px}
:focus-visible{outline:2px solid var(--sea);outline-offset:1px}
.bar{position:sticky;bottom:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
button{font:inherit;font-size:14px;border:1px solid var(--sea);background:transparent;color:var(--sea);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--sea);color:var(--on)}
canvas{width:100%;max-width:340px;height:120px;background:#fff;border:1px dashed var(--line);border-radius:8px;touch-action:none}
.rec{display:flex;gap:6px;margin:4px 0}.rec button:first-child{flex:1;text-align:left}
#ov{display:none;position:fixed;inset:0;background:#8a979d;overflow:auto;z-index:9}
#ov .tb{position:sticky;top:0;display:flex;gap:8px;justify-content:center;padding:8px;background:var(--card)}
.paper{background:#fff;color:#000;font:12pt/1.4 "Times New Roman",serif;width:210mm;min-height:297mm;margin:12px auto;padding:15mm 15mm 15mm 20mm}
.paper.d{font-size:13pt;display:flex;flex-direction:column}.ft{margin-top:auto;border-top:1px solid #000;font-size:10pt;padding-top:2px}.paper tr,.paper .sg{break-inside:avoid}
.paper p{margin:4px 0}.paper table{width:100%;border-collapse:collapse}
.paper .c{text-align:center}.paper .big{font-size:16px;margin:12px 0}
.paper .g td,.paper .g th{border:1px solid #000;padding:2px 6px;text-align:center;font-weight:400}
.paper .g td.l{text-align:left}.paper .g{margin:3px 0}.paper .sg td{width:50%;vertical-align:top;padding-top:10px}
.paper .en{font-size:11.5px;color:#222}.paper .i td{padding:1px 4px;vertical-align:top}
.paper img{mix-blend-mode:multiply}
.paper.gcn{font-size:13pt;line-height:1.15;padding:10mm 20mm 10mm 25mm;min-height:297mm}.gcn p{margin:0}.gcn table{width:105%;border-collapse:collapse}.gcn td{vertical-align:top}.gcn .en{font-size:11pt;font-style:italic}.gcn .dt{font-size:10pt}.gcn .i td{padding:0 3px 2mm 0}.gcn .g th,.gcn .g td{border:1px solid #000;padding:1px 4px;font-weight:700;text-align:center}.gcn .g .en{font-weight:400}.gcn .ft{margin-top:5mm}
@page gcn{size:A4;margin:10mm 20mm 10mm 25mm}
@media print{@page{size:A4;margin:15mm 15mm 15mm 20mm}body>*:not(#ov){display:none!important}#ov{position:static;background:none;display:block!important}#ov .tb{display:none}.paper{margin:0;padding:0;width:auto;min-height:0;zoom:1!important}.paper.d{min-height:262mm}.paper.gcn{page:gcn;padding:0;min-height:0}}
</style></head><body>
<header><h1>Lập biên bản đăng kiểm tàu cá</h1><p>Nhập một lần, in biên bản, đơn đề nghị và giấy chứng nhận. Dữ liệu lưu ngay trên máy này.</p></header>
<main><div id="f"></div>
<section><h2>Đăng kiểm viên</h2><div class="g2"><label class="w">Người lập biên bản<select id="ins"></select></label><label class="w">Họ tên<input id="in_n"></label><label>Ảnh chữ ký<input id="in_s" type="file" accept="image/*"></label><label>Ảnh con dấu<input id="in_d" type="file" accept="image/*"></label><label>Mã PIN hiện tại<input id="in_p" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></label><label>Mã PIN mới (đặt hoặc đổi)<input id="in_p2" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></label><div class="w"><button id="in_save" type="button">Lưu đăng kiểm viên</button> <button id="in_del" type="button">Xóa</button></div></div></section>
<section><h2>Chữ ký chủ tàu</h2><canvas id="cv" width="680" height="240"></canvas><div><button id="clr" type="button">Xóa chữ ký</button></div></section>
<section><h2>Hồ sơ đã lưu</h2><div id="ls"></div></section></main>
<div class="bar"><button class="p" id="sv">Lưu hồ sơ</button><button id="nw">Tàu mới</button><button id="b1">Xem, in biên bản</button><button id="b2">Đơn đề nghị</button><button id="b3">Giấy chứng nhận</button></div>
<div id="ov"><div class="tb"><button class="p" onclick="window.print()">In / Lưu PDF</button><button onclick="ov.style.display='none'">Đóng</button></div><div id="doc"></div></div>
<script>
const $=(s)=>document.querySelector(s),ov=$('#ov'),KEY='dkv1';
const ST=["Thỏa mãn","Hạn chế","Cấm hoạt động"],TY={hn:'HÀNG NĂM',dky:'ĐỊNH KỲ',td:'TRÊN ĐÀ'},LT={hn:'hàng năm',dky:'định kỳ',td:'trên đà'};
const EQ=[["Cứu sinh","02 phao tròn, 10 phao áo, còn mới."],["Tín hiệu","01 đèn neo, 02 đèn mạn, đèn khai thác."],["VTĐ","01 đàm 02 chiều, Icom, hoạt động tốt."],["Hàng hải","Định vị, la bàn lái còn hoạt động tốt."],["Neo","Tự chế, kiểu Hải quân."],["Lái","Vô lăng, lái nhẹ, ăn lái."],["Trang thiết bị chữa cháy","Bơm cơ 01, bơm điện 01, bình cứu hỏa, chăn chiên 01."],["Chống thủng, chống chìm","Bơm cơ 01, bơm điện 01, gầu, dụng cụ chống chìm."],["Khai thác","Phù hợp với nghề."],["Điện","04 acquy 200Ah."],["Lạnh","Thùng đá."],["Ngăn ngừa ô nhiễm biển","Thùng chứa."],["Trang thiết bị khác","Radio."]];
const DEF=()=>{const o={loai:'hn',noi:'Thanh Hóa',ngay:new Date().toISOString().slice(0,10),vung:'Biển Việt Nam, vùng biển hở hạn chế cách bờ hoặc nơi trú ẩn ≤ 100 hải lý',dkv:'Vũ Thanh Tùng',pgd:'Nguyễn Tùng Lâm',ncap:'Thanh Hóa',cap:'2',s_vo:'0',s_tt:'0',s_son:'0',s_truc:'0',s_m0:'0',s_m1:'0',s_m2:'0',s_m3:'0',nmc:'1',nmp:'0',yc:'Thường xuyên kiểm tra, bảo dưỡng các trang thiết bị trên tàu cá.',tt:'Thỏa mãn hoạt động'};EQ.forEach((q,i)=>{o['eq'+i]=q[1];o['s_eq'+i]='0'});return o};
let S=DEF();
const f=(k,l,t='text',c='')=>`<label class="${c}">${l}<input data-k="${k}" type="${t}"></label>`;
const sl=(k,a,b)=>`<select data-k="${k}">${b?'<option value="">—</option>':''}${a.map((o,i)=>`<option value="${i}">${o}</option>`).join('')}</select>`;
const sec=(t,b)=>`<section><h2>${t}</h2><div class="g2">${b}</div></section>`;
const NM=['Máy chính 1','Máy chính 2','Máy phụ 1','Máy phụ 2'];
$('#f').innerHTML=
sec('Loại biên bản',`<label class="w">Loại kiểm tra<select data-k="loai"><option value="hn">Hàng năm</option><option value="dky">Định kỳ / lần đầu / cải hoán</option><option value="td">Trên đà</option></select></label>`)+
sec('Tàu và chủ tàu',f('ten','Tên tàu')+f('dk','Số đăng ký')+f('hc','Hô hiệu')+f('nghe','Công dụng (nghề)')+f('nam','Năm, nơi đóng')+`<label>Vật liệu thân vỏ<select data-k="vl"><option value="">—</option><option>Gỗ</option><option>Thép</option><option>Composite</option></select></label>`+f('chu','Chủ tàu')+f('dc','Địa chỉ')+f('cccd','CCCD')+f('sdt','Điện thoại')+f('em','Email'))+
sec('Nơi, ngày, số',f('noi','Nơi kiểm tra')+f('ngay','Ngày kiểm tra','date')+f('so','Số biên bản (trống = tự sinh)','text','w'))+
sec('Kích thước, tải',['Lmax (m)','Ltk (m)','Bmax (m)','Btk (m)','D (m)','d (m)','Tổng dung tích GT','Trọng tải DW','Số thuyền viên','Mạn khô (m)'].map((l,i)=>f(['Lmax','Ltk','Bmax','Btk','D','d','GT','DW','tv','mk'][i],l)).join(''))+
sec('Thân tàu',[['vo','Phần vỏ'],['tt','Phần thượng tầng'],['son','Phần sơn']].map(([k,l])=>`<label>${l}${sl('s_'+k,ST)}</label>`).join('')+`<div class="w g2" data-only="dky"><h3 class="w">Các tính năng kỹ thuật (biên bản định kỳ)</h3>`+[['tdo','Tốc độ tự do (hải lý/h)'],['qpm','Quay phải: đường kính (m)'],['qps','Quay phải: thời gian (s)'],['qtm','Quay trái: đường kính (m)'],['qts','Quay trái: thời gian (s)'],['tim','Quán tính tiến: khoảng cách (m)'],['tis','Quán tính tiến: thời gian (s)'],['lim','Quán tính lùi: khoảng cách (m)'],['lis','Quán tính lùi: thời gian (s)']].map(([k,l])=>f(k,l)).join('')+`</div>`)+
sec('Máy và hệ trục',`<label>Số lượng máy chính<select data-k="nmc"><option>1</option><option>2</option></select></label><label>Số lượng máy phụ<select data-k="nmp"><option>0</option><option>1</option><option>2</option></select></label>`+NM.map((n,i)=>`<div class="w g2" data-en="${i}"><h3 class="w">${n}</h3>`+f('ky'+i,'Ký hiệu')+f('so'+i,'Số máy')+f('cs'+i,'Công suất (kW)')+f('vq'+i,'Vòng quay')+f('ct'+i,'Năm, nơi chế tạo')+`<label>Kết quả${sl('s_m'+i,ST)}</label></div>`).join('')+`<label class="w">Hệ trục chân vịt${sl('s_truc',ST)}</label>`)+
sec('Trang thiết bị',EQ.map((q,i)=>`<label class="w">${q[0]}<input data-k="eq${i}">${sl('s_eq'+i,ST)}</label>`).join(''))+
sec('Kết luận và giấy chứng nhận',f('yc','Yêu cầu cụ thể','text','w')+f('vung','Vùng hoạt động','text','w')+f('han','Hạn đến (trống = +1 năm)','date')+`<label>Cấp tàu<select data-k="cap">${['Không hạn chế','Hạn chế I','Hạn chế II','Hạn chế III'].map((o,i)=>`<option value="${i}">${o}</option>`).join('')}</select></label>`+f('gso','Số GCN')+f('gn','N⁰ GCN')+f('gngay','Ngày cấp GCN','date')+f('ncap','Nơi cấp GCN')+f('pgd','Phó giám đốc ký'));
const mx=a=>Math.max(0,...a.filter(x=>x!==''&&x!=null).map(Number));
const nT=()=>mx(['vo','tt','son'].map(k=>S['s_'+k])),nM=()=>mx(eng().map(i=>S['s_m'+i]).concat(S.s_truc)),nE=()=>mx(EQ.map((_,i)=>S['s_eq'+i]));
const KL=()=>["Thỏa mãn hoạt động","Hạn chế hoạt động","Cấm hoạt động"][Math.max(nT(),nM(),nE())];
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const v=k=>e(S[k]),dot=k=>v(k)||'………';
const D=d=>{if(!d)return'ngày …… tháng …… năm ……';const[y,m,x]=d.split('-');return`ngày ${x} tháng ${m} năm ${y}`};
const SO=()=>S.so||`${(S.ngay||'').slice(2,4)||'26'}/${(S.dk||'').replace(/\D/g,'')}/ĐKTC`;
const HAN=()=>S.han||(S.ngay?(+S.ngay.slice(0,4)+1)+S.ngay.slice(4):'');
const stT=r=>`<table class="g"><tr><th></th>${ST.map(s=>`<th>${s}</th>`).join('')}</tr>${r.map(([l,x])=>`<tr><td class="l">${l}</td>${ST.map((_,i)=>`<td>${x===String(i)?'X':''}</td>`).join('')}</tr>`).join('')}</table>`;
const head=()=>`<table><tr><td><b>BQL CẢNG CÁ VÀ ĐĂNG KIỂM<br>TÀU CÁ THANH HÓA</b><br>Số: ${e(SO())}</td><td class="c"><b>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</b><br><u>Độc lập - Tự do - Hạnh phúc</u><br><i>${v('noi')}, ${D(S.ngay)}</i></td></tr></table>`;
const sign=()=>`<table class="c sg"><tr><td><b>ĐẠI DIỆN CHỦ TÀU</b><br><i>(Ký, ghi rõ họ tên)</i><br>${S.sig?`<img src="${S.sig}" height="60" alt="">`:'<br><br><br>'}<br><b>${U('chu')}</b></td><td><b>ĐĂNG KIỂM VIÊN</b><br><i>(Ký, ghi rõ họ tên)</i>${ik()}<b>${U('dkv')}</b></td></tr></table>`;
function bb(){const t=S.loai,dky=t=='dky';
const mc=eng().map(i=>`<p><b>${NM[i]}:</b> Ký hiệu: ${dot('ky'+i)}; Số máy: ${dot('so'+i)}; Công suất: ${dot('cs'+i)} kW; Vòng quay định mức: ${dot('vq'+i)}; Năm, nơi chế tạo: ${dot('ct'+i)}</p>`+stT([['Kết quả kiểm tra',S['s_m'+i]]])).join('');
return`<div class="paper">${head()}<h3 class="c big">BIÊN BẢN KIỂM TRA KỸ THUẬT<br>${TY[t]}</h3>
<p>Tên tàu: <b>${dot('ten')}</b> &nbsp; Số đăng ký: <b>${dot('dk')}</b></p><p>Công dụng (nghề): ${dot('nghe')}; Năm, nơi đóng: ${dot('nam')}</p><p>Chủ tàu: ${dot('chu')}</p><p>Địa chỉ: ${dot('dc')}</p><p>Nơi kiểm tra: ${dot('noi')}</p>
${dky?`<p>Kích thước: Lmax ${dot('Lmax')} m; Ltk ${dot('Ltk')} m; Bmax ${dot('Bmax')} m; Btk ${dot('Btk')} m; D ${dot('D')} m; d ${dot('d')} m</p>`:''}
<p>Theo yêu cầu kiểm tra ${LT[t]} của chủ tàu.</p><p>Chúng tôi gồm: 1. ${dot('dkv')}, đăng kiểm viên của Ban quản lý Cảng cá và Đăng kiểm tàu cá Thanh Hóa.</p><p>Đã kiểm tra an toàn kỹ thuật ${LT[t]} tàu nói trên và nhận thấy:</p>
<p><b>A. THÂN TÀU</b></p>${stT([['- Phần vỏ',S.s_vo],['- Phần thượng tầng',S.s_tt],['- Phần sơn (đánh dấu tàu cá)',S.s_son]])}${dky?`<p>Các tính năng kỹ thuật: - Tốc độ tự do (hải lý/h): ${dot('tdo')}</p><p>- Đường kính vòng quay trở: Quay phải (m): ${dot('qpm')} Thời gian (s): ${dot('qps')}</p><p style="margin-left:52mm">Quay trái (m): ${dot('qtm')} Thời gian (s): ${dot('qts')}</p><p>- Quán tính: Tiến, khoảng cách (m): ${dot('tim')} Thời gian (s): ${dot('tis')}</p><p style="margin-left:22mm">Lùi, khoảng cách (m): ${dot('lim')} Thời gian (s): ${dot('lis')}</p>`:''}
<p><b>B. MÁY CHÍNH, MÁY PHỤ VÀ CÁC HỆ THỐNG</b></p>${mc}
<p><b>C. HỆ TRỤC CHÂN VỊT</b></p>${stT([['Kết quả kiểm tra',S.s_truc]])}
<p><b>D. CÁC TRANG THIẾT BỊ</b></p>${stT(EQ.map((q,i)=>['- '+q[0]+': '+v('eq'+i),S['s_eq'+i]]))}
<p><b>TÓM TẮT VỀ KẾT QUẢ KIỂM TRA</b></p>${stT([['1. Thân tàu',nT()+''],['2. Máy chính, máy phụ, hệ trục',nM()+''],['3. Các trang thiết bị',nE()+'']])}
<p><b>YÊU CẦU CỤ THỂ:</b> ${v('yc')}</p><p><b>KẾT LUẬN:</b> Căn cứ vào kết quả kiểm tra, kết luận: <b>${KL()}</b></p>
<p>- Vùng hoạt động: ${v('vung')}</p><p>- Thời hạn đến hết ${D(HAN())}, với điều kiện thực hiện các yêu cầu trên.</p><p>Mạn khô: ${dot('mk')} m; ${t=='td'?'Sức chở tối đa, tấn':'Trọng tải toàn phần (DW)'}: ${dot('DW')}; Số thuyền viên: ${dot('tv')} người</p>
<p>Biên bản lập 02 bản: chủ tàu 01 bản, đăng kiểm tàu cá 01 bản.</p>${sign()}</div>`}
function dn(){return`<div class="paper"><p class="c"><b>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</b><br><u>Độc lập - Tự do - Hạnh phúc</u></p><p class="c"><i>${v('noi')}, ${D(S.ngay)}</i></p>
<h3 class="c big">ĐƠN ĐỀ NGHỊ CẤP GIẤY CHỨNG NHẬN<br>AN TOÀN KỸ THUẬT TÀU CÁ</h3><p>Kính gửi: BQL Cảng cá và Đăng kiểm tàu cá Thanh Hóa.</p>
<p>Họ tên người đề nghị: <b>${dot('chu')}</b></p><p>Địa chỉ: ${dot('dc')}</p><p>CCCD số: ${dot('cccd')}; Điện thoại: ${dot('sdt')}</p>
<p>Tên tàu: ${dot('ten')}; Số đăng ký: ${dot('dk')}</p><p>Đề nghị cơ sở đăng kiểm kiểm tra ${LT[S.loai]} và cấp Giấy chứng nhận an toàn kỹ thuật tàu cá.</p>
<p>Kích thước cơ bản (m): Lmax ${dot('Lmax')}; Bmax ${dot('Bmax')}; D ${dot('D')}; Ltk ${dot('Ltk')}; Btk ${dot('Btk')}; d ${dot('d')}</p>
<p>Tổng dung tích (GT): ${dot('GT')}; Trọng tải toàn phần (DW): ${dot('DW')}; Số thuyền viên: ${dot('tv')}</p>
<p>Ký hiệu máy chính: ${dot('ky0')}; Tổng công suất máy chính (kW): ${dot('cs0')}; Số lượng máy chính: ${S.ky1?'02':'01'}</p>
<p>Thời gian và địa điểm đề nghị kiểm tra: ${D(S.ngay)} tại ${dot('noi')}.</p><p>Chúng tôi đồng ý trả đầy đủ phí và lệ phí đăng kiểm theo quy định hiện hành.</p>
<table class="c sg"><tr><td></td><td><b>ĐẠI DIỆN CHỦ TÀU</b><br><i>(Ký và ghi rõ họ tên)</i><br>${S.sig?`<img src="${S.sig}" height="60" alt="">`:'<br><br><br>'}<br>${v('chu')}</td></tr></table></div>`}
function gc(){const r=(a,b,x)=>`<td>${a}: <b>${x||'………'}</b><br><i class="en">${b}</i></td>`,
P=[0,1].reduce((s,i)=>s+(parseFloat(String(S['cs'+i]||0).replace(',','.'))||0),0),NE=[0,1].filter(i=>S['ky'+i]).length;
